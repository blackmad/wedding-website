<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding Save the Date: July 1st, 2025, Istanbul, Turkey</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.cdnjs.com/css2?family=Playfair+Display:wght@400;600&family=Alex+Brush&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta property="og:image" content="/image/propose.jpg">
    <meta name="twitter:image" content="/image/propose.jpg">
    <meta property="og:image:alt" content="Save the Date - Wedding in Istanbul">
    <meta name="twitter:image:alt" content="Save the Date - Wedding in Istanbul">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#A3DAD6',
                        'primary-content': '#2A4544',
                        'primary-dark': '#7DC3BE',
                        'primary-light': '#BFE5E2',
                        secondary: '#FF6F61',
                        'secondary-content': '#F9F9F9',
                        'secondary-dark': '#E55547',
                        'secondary-light': '#FF8F84',
                        background: '#FAF8F0',
                        foreground: '#F9F9F9',
                        border: '#F4E7D3',
                        copy: '#2A4544',
                        'copy-light': '#5A7573',
                        'copy-lighter': '#89A3A1',
                    },
                    fontFamily: {
                        'alex': ['Alex Brush', 'cursive'],
                        'playfair': ['Playfair Display', 'serif'],
                        'cinzel': ['Cinzel', 'serif'],
                    },
                    spacing: {
                        '18': '4.5rem',
                    },
                    letterSpacing: {
                        'widest-2': '0.25em',
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom styles only for specific design elements */
        .gradient-bg {
            background: linear-gradient(135deg, var(--background) 0%, var(--border) 100%);
        }

        .decorative-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--copy-lighter), transparent);
            opacity: 0.6;
        }

        .rsvp-button {
            transition: all 0.3s ease;
        }

        .rsvp-button:hover {
            transform: translateY(-2px);
        }

        .image-drop-shadow {
            -webkit-filter: drop-shadow(0 4px 6px rgba(42, 69, 68, 0.25));
            filter: drop-shadow(0 4px 6px rgba(42, 69, 68, 0.25));
            transition: all 0.5s ease;
        }

        .image-drop-shadow:hover {
            -webkit-filter: drop-shadow(0 8px 12px rgba(42, 69, 68, 0.3));
            filter: drop-shadow(0 8px 12px rgba(42, 69, 68, 0.3));
        }

        .text-shadow-sm {
            text-shadow: 0 2px 4px rgba(42, 69, 68, 0.1);
        }

     
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gradient-bg font-playfair text-copy leading-relaxed m-0 p-0">
    <div class="container mx-auto px-4 sm:px-6 md:px-8 max-w-4xl">
        <div class="bg-foreground rounded-3xl shadow-lg p-8 sm:p-10 md:p-16 border-4 sm:border-8 border-[#F4E7D3] text-center space-y-8 sm:space-y-10">
            <div class="space-y-4">
                <h1 class="font-alex text-5xl sm:text-6xl text-secondary font-normal text-shadow-sm leading-tight">
                    Save the Date
                </h1>
                
                <div class="decorative-line w-32 sm:w-40 md:w-48 mx-auto"></div>
                
                <div class="font-cinzel text-2xl sm:text-3xl text-copy font-light">
                    Yuva & David
                </div>
            </div>
            
            <div class="space-y-4">
                <div class="font-playfair text-xl sm:text-2xl  text-copy-light leading-relaxed">
                    July 1, 2025
                </div>
                
                <div class="font-playfair text-xl sm:text-2xl  text-copy-light leading-relaxed">
                    <span class="mx-3">Istanbul, Turkey</span>
                </div>
            </div>
            
            <div class="py-4 sm:py-0 image-container">
                <img src="/image/hands-tall.png" alt="Wedding Celebration" 
                     class="sm:hidden w-full max-w-2xl mx-auto rounded-2xl md:max-h-[25vh] object-contain image-drop-shadow rotate-landscape">
                <img src="/image/hands.png" alt="Wedding Celebration"
                     class="hidden sm:block w-full max-w-2xl mx-auto rounded-2xl md:max-h-[25vh] object-contain image-drop-shadow rotate-landscape">
            </div>
            
            <div class="">
                <div class="decorative-line w-32 sm:w-40 md:w-48 mx-auto"></div>
                
                <a href="https://docs.google.com/forms/d/1nDyh9RoSdh8i8fUv-KtVHVKVhsI33xHKnXWOeVYsYMI/edit?usp=forms_home&ths=true" 
                   class="rsvp-button inline-block bg-primary text-primary-content px-10 py-5 rounded-full text-base sm:text-lg uppercase tracking-widest-2 font-cinzel font-light hover:bg-secondary hover:text-secondary-content hover:shadow-lg">
                    RSVP
                </a>
            </div>
        </div>
    </div>
</body>
</html>
