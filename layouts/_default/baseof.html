<!DOCTYPE html>
<html lang="en">
    <head>
        <title> {{ .Site.Title }} </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, shrink-to-fit=no" />
        <link rel="icon" href="{{ .Site.BaseURL }}/image/favicon.png">

        <!-- <link href="style.css" rel="stylesheet" /> -->
        <link href="{{ .Site.BaseURL }}/css/style.css" rel="stylesheet" />
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <meta property="og:image" content="/image/propose.jpg">
        <meta name="twitter:image" content="/image/propose.jpg">
        <meta property="og:image:alt" content="Save the Date - Wedding in Istanbul">
        <meta name="twitter:image:alt" content="Save the Date - Wedding in Istanbul">
        {{ block "dynamic_styles" . -}}{{- end }}
    </head>
    <body id="top">
        {{ block "main" . -}}{{- end }}
        <script src="{{ .Site.BaseURL }}/js/script.js"></script>
    </body>
</html>
